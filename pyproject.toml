[project]
name = "rag-test"
version = "0.1.0"
description = "Local RAG agent: LangChain/LangGraph + pgvector + Ollama qwen3-embedding"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=0.3",
    "langchain-openai>=0.3,<0.4",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
